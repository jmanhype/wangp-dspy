[project]
name = "wangp-dspy"
version = "0.1.0"
description = "DSPy-native port of the WangP/Maestro video-gen workflow"
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wangp_dspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
