[project]
name = "wangp-dspy"
version = "0.1.0"
description = "DSPy-native port of the WangP/Maestro video-gen workflow"
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.5,<4",
    # qc lanes (extracted from paivot-hermes @ d1aab19): audit-derived
    "fastapi>=0.141.1",
    "pydantic>=2",
    "requests>=2.31",
    "soundfile>=0.12",
    "librosa>=0.10",
    "numpy>=1.26",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# dev/test extra: uv pip install -e .[dev]
dev = [
    "pytest>=8",
    "httpx>=0.28.1",  # fastapi TestClient
]
# GPU-side only (3090): lazy-imported inside load_real_model
qc-gpu = [
    "torch>=2.2",
    "transformers>=4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wangp_dspy", "qc", "qc/audio_critic", "qc/comic_critics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
